<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | ELASSAL OS</title>
<style>
:root{color-scheme:dark;--green:#39ff88;--bg:#070b0a;--panel:#101916;--muted:#a5b8ad}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#123023,#070b0a 65%);color:#f3fff7;font-family:system-ui,sans-serif}
main{width:min(100%,440px);padding:28px;border:1px solid #28553d;border-radius:22px;background:#101916ed;box-shadow:0 0 35px #39ff8815}
h1{margin:0;color:var(--green);letter-spacing:1px}h2{margin-top:24px}p{color:var(--muted)}label{display:block;margin-top:16px}
input{width:100%;margin-top:7px;padding:13px;border:1px solid #345444;border-radius:10px;background:#080e0b;color:white;font-size:16px}
button,.link{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:10px;border:1px solid var(--green);background:#39ff8815;color:var(--green);font-weight:700;text-decoration:none;cursor:pointer}
button{width:100%;font-size:16px}.notice{padding:10px;border-radius:9px;background:#17251d;margin-top:12px}.error{color:#ffaaa5}.success{color:var(--green)}small{color:var(--muted)}a{color:var(--green)}
</style>
</head>
<body><main>
<h1>🐺 ELASSAL OS</h1><p>YOUR CONTROL ROOM STARTS HERE</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}

<h2>تسجيل الدخول</h2>
<form method="post" autocomplete="on">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>اسم المستخدم أو البريد<input name="identity" required autocomplete="username"></label>
<label>كلمة المرور<input type="password" name="password" required autocomplete="current-password"></label>
<button type="submit">دخول</button>
</form><a class="link" href="{{ url_for('auth.register') }}">إنشاء حساب جديد</a>

</main></body></html>
